<div>
    <app-header/>
</div>
<div class="main_container">
    <h2>Login</h2>
    <hr>
    <form class="login">
        <div class="seccion_usuario">
        <label>Usuario/Correo Electronico:</label>
        <input type="text" id="username" name="username" placeholder="Usuario/Correo" class="inputs_estilo"/>
        </div>
        <div class="seccion_contra">
        <label>Contraseña:</label>
        <input type="password" id="password" name="password" type="password" placeholder="Contraseña" class="inputs_estilo"/>
        </div>
        <button class="boton_azul">Iniciar Sesion</button>
    </form>
</div>
